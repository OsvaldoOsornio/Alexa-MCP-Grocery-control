name: CI

# Two independent jobs rather than one, because the Python and Node sides
# share no artifacts and a failure in one should not hide the result of the
# other. Both run on every push and pull request to the long-lived branches.
on:
  push:
    branches: [main, master, submission-prep]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest

    services:
      # The whole point of a service container here: the three tests that
      # cover the `calculate_pantry_expiration` trigger skip unless
      # TEST_DATABASE_URL is set, so locally they usually do not run at all.
      # With this they run on every push, which makes CI the only place the
      # expiry logic -- the heart of the product -- is reliably exercised.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: zero_waste_sous_chef
        ports:
          - 5432:5432
        # Without this the steps below start racing Postgres' own startup.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        # requirements-dev.txt pulls in requirements.txt plus pytest and the
        # psycopg driver the integration tests connect with.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Apply schema and seeds
        # docker-compose.yml does this through /docker-entrypoint-initdb.d,
        # but a service container exposes no such hook, so the same files are
        # applied by hand here. They stay the single source of truth.
        env:
          PGPASSWORD: changeme
        run: |
          psql -h localhost -U postgres -d zero_waste_sous_chef -v ON_ERROR_STOP=1 -f database/schema.sql
          psql -h localhost -U postgres -d zero_waste_sous_chef -v ON_ERROR_STOP=1 -f database/seed_shelf_life_rules.sql
          psql -h localhost -U postgres -d zero_waste_sous_chef -v ON_ERROR_STOP=1 -f database/seed_demo_user.sql

      - name: Run tests
        env:
          # Synchronous driver: these tests do not use the app's async engine.
          TEST_DATABASE_URL: postgresql+psycopg://postgres:changeme@localhost:5432/zero_waste_sous_chef
        run: python -m pytest -q

      - name: Fail if the trigger tests were skipped
        # A green run that silently skipped the trigger tests is worse than a
        # red one: it reads as coverage that is not there, which is exactly
        # how those tests went unrun for the whole project so far.
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:changeme@localhost:5432/zero_waste_sous_chef
        run: |
          output=$(python -m pytest -q tests/test_integration_postgres.py)
          echo "$output"
          if echo "$output" | grep -q "skipped"; then
            echo "::error::The PostgreSQL trigger tests were skipped. TEST_DATABASE_URL is not reaching them."
            exit 1
          fi

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Node 24 LTS the README asks for.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` rather than `npm install`, so the lockfile is enforced and a
      # drifting transitive dependency fails here instead of in a demo.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
